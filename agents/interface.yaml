interface:
  display_name: "乔木 DeepSeek API"
  short_description: "用 DeepSeek 官方 API 搜索、问文档、做 OCR、转写和配音"
  default_prompt: "使用 $qiaomu-deepseek-api 处理我指定的网页、文件、文本或音频。请检查工具调用、引用和输出文件。"
permissions:
  network: "https://api.deepseek.com only for the requested operation"
  file_write: "Explicit output path or user-initiated setup; delete only files uploaded for the current ask-file command"
  interactive: "Credential setup in the user's terminal only"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "claude", "agent-skills-compatible", "generic"]
